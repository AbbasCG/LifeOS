<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4446c4" />
<title>LifeOS — Offline</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f8fc; --text: #18243a; --muted: #718096; --card: #fff; --border: #e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --text: #f1f5f9; --muted: #9caac1; --card: #151c30; --border: #2d3852; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 420px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px 26px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: var(--muted); line-height: 1.6; margin: 6px 0; }
  button { margin-top: 18px; min-height: 44px; padding: 10px 20px; border: 0; border-radius: 10px; background: #5455dc; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You’re offline · أنت غير متصل</h1>
  <p>LifeOS needs a connection to load your workspace. Your data is safe on the server.</p>
  <p dir="rtl" lang="ar">يحتاج LifeOS إلى اتصال لتحميل مساحة عملك. بياناتك محفوظة بأمان على الخادم.</p>
  <button type="button" onclick="location.reload()">Try again · إعادة المحاولة</button>
</main>
</body>
</html>
