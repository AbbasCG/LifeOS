name: E2E environment
description: >
  Everything a Playwright job needs before it runs a test: PHP + Composer packages (cached), Node + npm packages (cached), the production
  build of the frontend, and Chromium (cached download; system libraries installed either way). Shared by the sharded browser jobs and the
  dev-server picker job so the setup exists once.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo_sqlite, intl, openssl
        coverage: none
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: composer-${{ hashFiles('backend/composer.lock') }}
    - name: Backend
      shell: bash
      working-directory: backend
      run: |
        composer install --no-interaction --no-progress --prefer-dist
        cp .env.example .env
        php artisan key:generate --no-interaction
    - name: Frontend packages and build
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        npm run build
      env:
        LIFEOS_BUILD_ID: ${{ github.sha }}
    # The browser download is cached by the lock file (which pins @playwright/test); the OS libraries it needs are not part of the cache.
    - name: Cache Playwright browsers
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
    - name: Install Chromium
      shell: bash
      working-directory: frontend
      # The OS libraries come from the Ubuntu archives through apt. The script probes them with a real package download, falls back to the other
      # official hosts, retries a bounded number of times and fails loudly with the per-host evidence (CI runs 205 and PR 92 sat 15 minutes in apt).
      run: ../scripts/ci-install-chromium-deps.sh "${{ steps.browsers.outputs.cache-hit }}"
