name: E2E environment
description: >
  Everything a Playwright job needs before it runs a test: PHP + Composer packages (cached), Node + npm packages (cached), the production
  build of the frontend, and Chromium (cached download; system libraries installed either way). Shared by the sharded browser jobs and the
  dev-server picker job so the setup exists once.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo_sqlite, intl, openssl
        coverage: none
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: composer-${{ hashFiles('backend/composer.lock') }}
    - name: Backend
      shell: bash
      working-directory: backend
      run: |
        composer install --no-interaction --no-progress --prefer-dist
        cp .env.example .env
        php artisan key:generate --no-interaction
    - name: Frontend packages and build
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        npm run build
      env:
        LIFEOS_BUILD_ID: ${{ github.sha }}
    # The browser download is cached by the lock file (which pins @playwright/test); the OS libraries it needs are not part of the cache.
    - name: Cache Playwright browsers
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
    - name: Install Chromium
      shell: bash
      working-directory: frontend
      run: |
        # The system packages come from the Ubuntu mirrors through apt. When the runner cannot resolve those hosts (CI run 205: every browser job
        # sat in this step for 8-18 minutes of silent apt timeouts and then failed before any test ran), apt is told to give up quickly on a dead
        # mirror, and the whole install is retried a bounded number of times, which rides out a short outage. If the mirrors stay unreachable the
        # step still FAILS, loudly and with the apt output above: nothing is skipped and no test runs against a half-installed browser.
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-network > /dev/null
        if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
          install=(npx playwright install-deps chromium)
        else
          install=(npx playwright install --with-deps chromium)
        fi
        attempts=3
        for attempt in $(seq 1 "$attempts"); do
          if timeout 300 "${install[@]}"; then
            exit 0
          fi
          echo "::warning::Installing Chromium's system packages failed (attempt $attempt of $attempts)"
          if [ "$attempt" -lt "$attempts" ]; then
            sleep $((attempt * 30))
          fi
        done
        echo "::error::Chromium's system packages could not be installed after $attempts attempts (usually the Ubuntu mirrors are unreachable from the runner; see the apt errors above). No test was run."
        exit 1
