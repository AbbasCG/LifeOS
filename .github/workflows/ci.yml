name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway credentials for the CI-only database service above; no repository secrets are needed.
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'lifeos_test' || ':memory:' }}
      DB_USERNAME: lifeos
      DB_PASSWORD: lifeos
      # PostgreSQL tests run with the client in a non-UTC zone (libpq reads PGTZ): the app must not depend on the database's own zone
      # (a 60-minute focus session once looked 60 minutes old the moment it started on a server set to Europe/Amsterdam).
      PGTZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, intl, openssl
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Code style (Pint)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test
      - name: Run migrations against PostgreSQL
        if: matrix.database == 'pgsql'
        run: php artisan migrate --force --no-interaction
      - name: Tests
        run: php vendor/bin/phpunit
      - name: Dependency audit
        if: matrix.database == 'sqlite'
        run: composer audit --no-interaction

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          LIFEOS_BUILD_ID: ${{ github.sha }}
      - name: First-load size budget
        run: npm run check:size
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    # Isolated by design: a throwaway SQLite database seeded with the demo account, no provider credentials or AI keys,
    # and every request outside 127.0.0.1 is blocked by the test fixtures — the suite can never reach a real account.
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, intl, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - name: Backend
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
        env:
          LIFEOS_BUILD_ID: ${{ github.sha }}
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
      # The date/time pickers again on the Vite dev server (React StrictMode, unminified): a picker that works in the production build
      # but closes itself in development is how this kind of bug reaches the people building the app.
      - name: Date pickers on the dev server
        working-directory: frontend
        run: E2E_DEV=1 npx playwright test e2e/picker.spec.ts e2e/date-pickers.spec.ts --project=desktop
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
