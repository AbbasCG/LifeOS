name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that PR's older, now pointless run. Pushes to main are never cancelled and never replace each
# other (each commit gets its own group): every commit that lands on main keeps its own full CI result, which is what the deploy
# workflow looks for.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Laravel (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway credentials for the CI-only database service above; no repository secrets are needed.
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'lifeos_test' || ':memory:' }}
      DB_USERNAME: lifeos
      DB_PASSWORD: lifeos
      # PostgreSQL tests run with the client in a non-UTC zone (libpq reads PGTZ): the app must not depend on the database's own zone
      # (a 60-minute focus session once looked 60 minutes old the moment it started on a server set to Europe/Amsterdam).
      PGTZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, intl, openssl
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Code style (Pint)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test
      - name: Run migrations against PostgreSQL
        if: matrix.database == 'pgsql'
        run: php artisan migrate --force --no-interaction
      - name: Tests
        run: php vendor/bin/phpunit
      - name: Dependency audit
        if: matrix.database == 'sqlite'
        run: composer audit --no-interaction

  frontend:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          LIFEOS_BUILD_ID: ${{ github.sha }}
      - name: First-load size budget
        run: npm run check:size
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # Browser tests, split across runners. All tests share one demo account and one single-threaded PHP server, so a runner can only run
  # them one at a time; separate runners each get their own database and server. Which spec files run where is decided by
  # scripts/e2e-shards.mjs from measured durations (balanced to within a few seconds), and a unit test fails if a spec file could ever
  # be left out of the plan. Isolated by design: a throwaway SQLite database seeded with the demo account, no provider credentials or
  # AI keys, and every request outside 127.0.0.1 is blocked by the test fixtures — the suite can never reach a real account.
  e2e-shard:
    name: Playwright shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false      # every shard reports; one failure never hides another
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-setup
      - name: Choose this shard's spec files
        working-directory: frontend
        run: node scripts/e2e-shards.mjs env ${{ matrix.shard }} ${{ strategy.job-total }} | tee -a "$GITHUB_ENV"
      - name: Browser tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # The date/time pickers again on the Vite dev server (React StrictMode, unminified): a picker that works in the production build
  # but closes itself in development is how this kind of bug reaches the people building the app. Runs alongside the shards.
  e2e-dev-server:
    name: Playwright dev server (pickers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-setup
      - name: Date pickers on the dev server
        working-directory: frontend
        run: E2E_DEV=1 npx playwright test e2e/picker.spec.ts e2e/date-pickers.spec.ts --project=desktop
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dev-server
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # One result for all browser jobs, under the name branch protection already knows ("Browser (Playwright)"): it fails unless every
  # shard and the dev-server job succeeded, and it also runs (and fails) when they were cancelled or skipped, so a missing shard can
  # never read as a pass. The per-shard names are not meant to be required checks; this one is.
  e2e:
    name: Browser (Playwright)
    needs: [e2e-shard, e2e-dev-server]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every browser job must have succeeded
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
          DEV: ${{ needs.e2e-dev-server.result }}
        run: |
          echo "shards: $SHARDS | dev server: $DEV"
          [ "$SHARDS" = "success" ] && [ "$DEV" = "success" ]

  # Static checks and offline tests for the deploy tooling (scripts/ and .github/workflows/deploy.yml). Nothing here can reach a server:
  # the deploy script runs against a temporary git remote with stubbed php/composer/npm/pg_dump/curl/sudo.
  deploy-tooling:
    name: Deploy tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n scripts/deploy-production.sh scripts/deploy-ssh-entrypoint.sh scripts/deploy-resolve.sh scripts/tests/deploy-production.test.sh scripts/tests/deploy-resolve.test.sh
          shellcheck -x -S warning scripts/deploy-production.sh scripts/deploy-ssh-entrypoint.sh scripts/deploy-resolve.sh scripts/tests/deploy-production.test.sh scripts/tests/deploy-resolve.test.sh
      - name: Workflow lint (actionlint)
        run: |
          python3 -m pip install --user actionlint-py==1.7.12.25
          "$HOME/.local/bin/actionlint" .github/workflows/*.yml
      - name: Deploy script scenarios (offline)
        run: scripts/tests/deploy-production.test.sh
      - name: Deploy resolver scenarios (offline, stubbed GitHub API)
        run: scripts/tests/deploy-resolve.test.sh
