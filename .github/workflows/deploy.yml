name: Deploy production
run-name: >-
  Deploy ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha || 'main' }}${{ inputs.dry_run && ' dry-run' || '' }}${{ inputs.action == 'rollback' && ' rollback' || '' }}

# CD is separate from CI (ci.yml). A deploy only ever ships a full SHA that (1) is on main and (2) has a green push-CI run, and the server
# re-checks (1) itself. All of that is decided by scripts/deploy-resolve.sh (tested offline in CI job "Deploy tooling").
#
#  - Automatic (hybrid policy): a human merges a pull request; when CI finishes on that merge commit on main, this workflow runs for that exact
#               SHA only if CI succeeded, the SHA is still the head of main, it came from a merged PR and it was not deployed before.
#               It is switched on by the repository variable AUTO_DEPLOY = "true" (set it to anything else, or delete it, to stop automatic
#               deploys at once). There is no second approval: add none to the `production` environment if you want it fully automatic.
#  - Manual:    Actions -> "Deploy production" -> Run workflow (sha empty = current main head; dry_run and rollback available). Always works,
#               also with AUTO_DEPLOY off.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy (go forward) or rollback (code only; never touches the database)
        type: choice
        options: [deploy, rollback]
        default: deploy
      sha:
        description: Full 40-character commit on main (empty = current head of main; required for rollback)
        type: string
        required: false
      dry_run:
        description: Validate only on the server (git state, plan); change nothing
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time, queued rather than cancelled: cancelling a run half-way through a release would be worse than waiting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and verify the commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && vars.AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      action: ${{ steps.pick.outputs.action }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      # The resolver comes from the head of main (trusted, reviewed code), never from the commit being deployed.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/deploy-resolve.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Pick and verify the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_ACTION: ${{ inputs.action }}
        run: bash scripts/deploy-resolve.sh

  deploy:
    name: Deploy over SSH
    needs: resolve
    if: ${{ needs.resolve.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment are the manual approval gate; its secrets/variables are not visible to any other job.
    environment:
      name: production
      url: https://life.softbuild.nl
    steps:
      - name: Prepare SSH (pinned host key, no StrictHostKeyChecking=no)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS are not set on the production environment"; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" > /dev/null   # fails early on a malformed key, without printing it

      - name: Run the deploy on the server
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
          ACTION: ${{ needs.resolve.outputs.action }}
          SHA: ${{ needs.resolve.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [ -n "$HOST" ] && [ -n "$SSH_USER" ] || { echo "::error::DEPLOY_HOST / DEPLOY_USER variables are not set"; exit 1; }
          [ "$SSH_USER" != "root" ] || { echo "::error::refusing to deploy as root"; exit 1; }
          remote="$ACTION $SHA"
          [ "$DRY_RUN" = "true" ] && remote="$remote dry-run"
          # The server-side forced command (scripts/deploy-ssh-entrypoint.sh) accepts only this exact shape.
          ssh -i "$HOME/.ssh/id_deploy" -p "${PORT:-22}" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SSH_USER@$HOST" "$remote"
          {
            echo "### Result"
            echo "\`$remote\` finished successfully on the server (dry-run: ${DRY_RUN:-false})."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the SSH key from the runner
        if: always()
        run: rm -f "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"
